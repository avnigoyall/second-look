<!doctype html><html><head><meta charset="utf-8"><title>Waxed Field Jacket</title>
<!-- Claude price tier fixture: JSON-LD has a name but no price, there are no meta or itemprop prices, the only
     price sits inside a long sentence (the DOM reader skips it), and it comes after more than 8000 characters
     of review text (so /read-page, which sees only the first 8000, cannot find it). -->
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Product","name":"Waxed Field Jacket","image":"/img/jeans.jpg"}</script>
<style>body{font:16px Georgia,serif;padding:40px;max-width:760px}.review{color:#555;font-size:14px}</style></head>
<body><main><h1>Waxed Field Jacket</h1><img src="/img/jeans.jpg" width="320" height="400" alt="">
<section id="reviews"><h2>Reviews</h2></section>
<section id="buy"><p>Ships in two days. The Waxed Field Jacket is on sale this week for $129.00, down from the usual $180.00, in every size we carry.</p>
<button id="add">Add to cart</button>
<p>Free returns within 30 days on orders over $50.</p></section></main>
<script>
  // About 14000 characters of review text before the buy section.
  const lines = [
    "Fits true to size and the wax finish shrugs off light rain on my walk to work.",
    "The corduroy collar is soft and the pockets are deep enough for a paperback book.",
    "I sized up to wear a sweater underneath and the sleeves are still the right length.",
    "After a season of use the wax has worn in nicely and the color looks even better.",
  ];
  const reviews = document.getElementById("reviews");
  for (let i = 0; i < 80; i++) {
    const p = document.createElement("p");
    p.className = "review";
    p.textContent = `Review ${i + 1}: ${lines[i % lines.length]} ${lines[(i + 1) % lines.length]}`;
    reviews.appendChild(p);
  }
</script></body></html>
