<!doctype html><html><head><meta charset="utf-8"><title>Cart | Uniqlo-style</title>
<style>body{font:14px Helvetica,sans-serif;padding:40px} .row{display:flex;gap:16px;padding:12px;border-bottom:1px solid #ccc}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;place-items:center} .overlay.open{display:grid}
.modal{background:#fff;padding:24px;border-radius:8px}</style></head>
<body>
<header><a href="#" id="cart-link" aria-label="Cart, 2 items">Cart (<span id="count">2</span>)</a></header>
<main><h1>Cart</h1>
  <div class="row" id="r-shirt"><div><div class="name">Relaxed Linen Shirt</div><div>Natural / M</div><div>$39.90</div></div><a href="#" class="remove">Remove</a></div>
  <div class="row" id="r-trousers"><div><div class="name">Pleated Wool Trousers</div><div>Gray / 32</div><div>$79.00</div></div><a href="#" class="remove">Remove</a></div>
</main>
<div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="q">
  <p id="q">Are you sure you want to remove this item?</p>
  <button id="confirm-remove" type="button">Remove</button> <button id="confirm-cancel" type="button">Cancel</button>
</div></div>
<script>
  let target = null;
  document.querySelectorAll(".remove").forEach((a) => a.addEventListener("click", (e) => {
    e.preventDefault(); target = a.closest(".row"); document.getElementById("overlay").classList.add("open");
  }));
  document.getElementById("confirm-cancel").addEventListener("click", () => { target = null; document.getElementById("overlay").classList.remove("open"); });
  document.getElementById("confirm-remove").addEventListener("click", () => {
    setTimeout(() => {   // the store removes the row a moment later, like a real API round trip
      target?.remove(); target = null;
      const c = document.getElementById("count"); c.textContent = String(Number(c.textContent) - 1);
      document.getElementById("overlay").classList.remove("open");
    }, 300);
  });
</script>
</body></html>
