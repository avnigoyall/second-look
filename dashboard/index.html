<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Look Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232f6b4f'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='white' stroke-width='3.5'/%3E%3Ccircle cx='16' cy='16' r='2.2' fill='white'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f1ea; --card: #fffcf7; --ink: #2a221c; --muted: #6f6154; --line: #e4d9cb;
    --accent: #3f2e22; --accent-ink: #faf6f0; --danger: #9a3b2b;
    --have: #4e6577; --trend: #8f6026; --good: #566b41;
    --radius: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16120f; --card: #201a16; --ink: #f2ebe2; --muted: #ab9c8d; --line: #3a3029;
      --accent: #c9a582; --accent-ink: #1c150f; --danger: #e08a76;
      --have: #9fb3c4; --trend: #d9aa6a; --good: #a6bd8a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 32px 16px 64px; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 15px; margin: 32px 0 12px; color: var(--muted); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; }
  form { display: grid; gap: 12px; max-width: 360px; }
  label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  input { font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
          background: var(--bg); color: var(--ink); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button { font: inherit; font-weight: 600; padding: 10px 16px; border-radius: 8px; border: 0; cursor: pointer;
           background: var(--accent); color: var(--accent-ink); }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; font-size: 13px; }
  button:disabled { opacity: 0.6; cursor: default; }
  .error { color: var(--danger); font-size: 13px; min-height: 1.5em; margin: 0; }
  .muted { color: var(--muted); margin: 0; }
  .stat-label { font-size: 13px; color: var(--muted); margin: 0; }
  .stat { font-size: 40px; font-weight: 700; letter-spacing: -0.02em; margin: 4px 0 8px; font-variant-numeric: tabular-nums; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; }
  li + li { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 12px; }
  li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: baseline; }
  li .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  li .price { font-variant-numeric: tabular-nums; }
  li .meta { grid-column: 1 / -1; font-size: 13px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
  .badge.have_this_look { color: var(--have); }
  .badge.micro_trend { color: var(--trend); }
  .badge.good_buy { color: var(--good); }
  [hidden] { display: none !important; }

  /* Editorial theme (references/): serif headings, thin rules, square buttons with small uppercase labels */
  :root { --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif; --radius: 4px; }
  header { padding-bottom: 18px; border-bottom: 1px solid var(--line); }
  h1 { font-family: var(--serif); font-size: 22px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; }
  h2 { font-family: var(--serif); font-size: 24px; font-weight: 500; color: var(--ink); }
  button { border-radius: 3px; text-transform: uppercase; letter-spacing: 0.12em; font-size: 12px; padding: 12px 20px; }
  button.ghost { border-color: var(--accent); color: var(--accent); font-size: 11px; }
  input { border-radius: 3px; }
  .stat-label { text-transform: uppercase; letter-spacing: 0.14em; font-size: 11px; }
  .stat { font-family: var(--serif); font-weight: 500; letter-spacing: 0; }
  .badge { border-radius: 2px; text-transform: uppercase; letter-spacing: 0.1em; font-size: 10.5px; }
  li .name { font-family: var(--serif); font-size: 16px; font-weight: 500; }

  /* Type from references/reference-3: Inter, lowercase, extra-bold headlines, pill buttons */
  @font-face { font-family: "SL Inter"; font-style: normal; font-weight: 400 800; font-display: swap;
    src: url("/dashboard-assets/fonts/Inter-latin.woff2") format("woff2"); }
  :root { --font: "SL Inter", "Inter", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; --serif: var(--font); --radius: 20px; }
  body, button, input { font-family: var(--font); letter-spacing: -0.01em; }
  h1 { text-transform: lowercase; font-weight: 800; font-size: 26px; letter-spacing: -0.05em; }
  h1::after { content: "."; }
  h2 { text-transform: lowercase; font-weight: 800; font-size: 28px; letter-spacing: -0.04em; }
  button { border-radius: 999px; text-transform: lowercase; letter-spacing: -0.01em; font-size: 14px; }
  input { border-radius: 14px; }
  .stat-label { text-transform: lowercase; letter-spacing: 0; font-size: 14px; font-weight: 500; }
  .stat { font-weight: 800; letter-spacing: -0.045em; }
  .badge { border-radius: 999px; text-transform: lowercase; letter-spacing: 0; font-size: 12px; }
  li .name { font-weight: 700; font-size: 15px; letter-spacing: -0.02em; }
  .goal button.goal-btn { border-radius: 999px; } /* goal.css widget follows the pill buttons */
</style>
</head>
<body>
<main>
  <header>
    <h1>Second Look</h1>
    <button id="logout" class="ghost" hidden>Log out</button>
  </header>

  <section id="login-view" class="card" hidden>
    <form id="login-form">
      <label>Email <input id="email" type="email" autocomplete="username" required></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
      <button type="submit">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <section id="dash-view" hidden>
    <div class="card">
      <p class="stat-label">Money kept by skipping</p>
      <p class="stat" id="money-kept">$0.00</p>
      <p class="muted" id="who"></p>
    </div>
    <h2>Recent verdicts</h2>
    <div class="card">
      <p id="dash-error" class="error" role="alert" hidden></p>
      <p id="empty" class="muted" hidden>No verdicts yet. Send an item from the extension to see it here.</p>
      <ul id="verdicts"></ul>
    </div>
  </section>
</main>

<script>
  const TOKEN_KEY = "secondLookToken";
  const LABELS = { have_this_look: "You have this look", micro_trend: "Micro trend", good_buy: "Good buy" };
  const ACTIONS = { none: "No action yet", skipped: "Skipped", bought: "Bought" };
  const FEEDBACK = { none: "", up: "Thumbs up", down: "Thumbs down" };
  const $ = (id) => document.getElementById(id);
  const money = (n) => "$" + Number(n || 0).toFixed(2);

  function getToken() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } }
  function setToken(t) { try { t ? localStorage.setItem(TOKEN_KEY, t) : localStorage.removeItem(TOKEN_KEY); } catch {} }

  async function api(path, options = {}) {
    const headers = { "Content-Type": "application/json" };
    const token = getToken();
    if (token) headers.Authorization = "Bearer " + token;
    const res = await fetch(path, { ...options, headers });
    const body = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(typeof body.detail === "string" ? body.detail : "Request failed (" + res.status + ")");
      err.status = res.status;
      throw err;
    }
    return body;
  }

  function show(view) {
    $("login-view").hidden = view !== "login";
    $("dash-view").hidden = view !== "dash";
    $("logout").hidden = view !== "dash";
  }

  function renderVerdicts(list) {
    const ul = $("verdicts");
    ul.replaceChildren();
    $("empty").hidden = list.length > 0;
    for (const v of list) {
      const li = document.createElement("li");
      const name = document.createElement("span");
      name.className = "name"; name.textContent = v.item.name;
      const price = document.createElement("span");
      price.className = "price"; price.textContent = v.item.price != null ? money(v.item.price) : "";
      const meta = document.createElement("span");
      meta.className = "meta";
      const badge = document.createElement("span");
      badge.className = "badge " + v.verdict; badge.textContent = LABELS[v.verdict];
      const rest = document.createElement("span");
      rest.textContent = [ACTIONS[v.action], FEEDBACK[v.feedback], new Date(v.created_at).toLocaleString()]
        .filter(Boolean).join(" · ");
      meta.append(badge, rest);
      li.append(name, price, meta);
      ul.append(li);
    }
  }

  async function loadDashboard() {
    try {
      const [{ user }, data] = await Promise.all([api("/auth/me"), api("/dashboard")]);
      $("who").textContent = "Logged in as " + user.email;
      $("money-kept").textContent = money(data.money_kept);
      renderVerdicts(data.verdicts);
      $("dash-error").hidden = true;
      show("dash");
    } catch (e) {
      if (e.status === 401) { setToken(null); show("login"); return; }
      show("dash");
      $("dash-error").textContent = "Could not load the dashboard: " + e.message;
      $("dash-error").hidden = false;
    }
  }

  $("login-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = e.submitter; btn.disabled = true; $("login-error").textContent = "";
    try {
      const { token } = await api("/auth/login", {
        method: "POST",
        body: JSON.stringify({ email: $("email").value, password: $("password").value }),
      });
      setToken(token);
      await loadDashboard();
    } catch (err) {
      $("login-error").textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  $("logout").addEventListener("click", () => { setToken(null); show("login"); });

  getToken() ? loadDashboard() : show("login");
</script>
<script src="/dashboard-assets/goal.js" defer></script>
</body>
</html>
