<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Style threads | Second Look</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317142A'/%3E%3Ccircle cx='10' cy='11' r='3' fill='%237BA4FF'/%3E%3Ccircle cx='22' cy='9' r='2.5' fill='%23FF8FB4'/%3E%3Ccircle cx='17' cy='22' r='3.5' fill='%23F2D78A'/%3E%3Cpath d='M10 11L22 9M10 11L17 22M22 9L17 22' stroke='%23ECE8F7' stroke-opacity='.5'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/dashboard-assets/graph.css">
<script src="/dashboard-assets/vendor/graphology.umd.min.js"></script>
<script src="/dashboard-assets/vendor/graphology-library.min.js"></script>
<script src="/dashboard-assets/vendor/sigma.min.js"></script>
</head>
<body>
<div id="stage" class="stage" aria-label="Interactive graph of clothing styles, communities and authors"></div>

<header class="masthead">
  <h1>Style threads</h1>
  <p id="subtitle" class="subtitle">Loading the Bluesky sample</p>
  <div class="search">
    <label class="visually-hidden" for="search">Find a style, community or author</label>
    <input id="search" type="search" placeholder="Find a style, community or author" autocomplete="off" spellcheck="false">
    <ul id="suggestions" class="suggestions" role="listbox" hidden></ul>
  </div>
</header>

<nav class="controls" aria-label="Graph controls">
  <div class="views" role="tablist" aria-label="View">
    <button id="view-map" role="tab" aria-selected="true">Styles and communities</button>
    <button id="view-authors" role="tab" aria-selected="false">Every author</button>
  </div>
  <fieldset id="edge-kinds" class="kinds">
    <legend>Connections</legend>
  </fieldset>
  <ul id="families" class="families" aria-label="Garment families"></ul>
  <button id="reset" class="reset" title="Fit the whole graph (F)">Fit graph</button>
</nav>

<aside id="inspector" class="inspector" aria-live="polite" hidden>
  <button id="close" class="close" aria-label="Close details">Close</button>
  <p id="compare-hint" class="compare-hint" hidden>Click another node to compare them.</p>
  <div id="detail"></div>
</aside>

<div id="tooltip" class="tooltip" hidden></div>
<div id="status" class="status" role="status"></div>

<script src="/dashboard-assets/graph.js"></script>
</body>
</html>
